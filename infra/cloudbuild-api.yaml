# FinanceTracker API + Pipeline Job — Cloud Build → Artifact Registry → Cloud Run
#
# Gatilhos (um por branch), arquivo de configuração: /infra/cloudbuild-api.yaml
#   main      → _APP_ENV=production  _SUFFIX=(vazio)
#   developer → _APP_ENV=staging     _SUFFIX=-staging
# Filtro de arquivos incluídos no gatilho: api/**
#
# Os DEFAULTS abaixo apontam para STAGING de propósito: um gatilho mal configurado
# nunca publica em produção por engano.
#
# Segurança:
#   - API sem acesso público (--no-allow-unauthenticated); só a SA do web invoca.
#   - Cada serviço roda com service account própria, com permissões mínimas.

steps:
  - id: Test
    name: python:3.12-slim
    dir: api
    entrypoint: sh
    args:
      - -c
      - |
        pip install --quiet uv==0.11.9 \
        && uv sync --frozen \
        && uv run ruff check . \
        && uv run pytest -q

  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ft-api:$COMMIT_SHA
      - api

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ft-api:$COMMIT_SHA

  - id: DeployApi
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ft-api${_SUFFIX}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ft-api:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=ft-api@$PROJECT_ID.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --set-env-vars=APP_ENV=${_APP_ENV}
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=2
      - --quiet

  - id: DeployJob
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ft-pipeline${_SUFFIX}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ft-api:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=ft-pipeline@$PROJECT_ID.iam.gserviceaccount.com
      - --command=python
      - --args=-m,ft.pipeline
      - --set-env-vars=APP_ENV=${_APP_ENV}
      - --memory=1Gi
      - --max-retries=1
      - --task-timeout=30m
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ft-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: southamerica-east1
  _AR_REPO: finance-tracker
  _APP_ENV: staging
  _SUFFIX: -staging
